# air: Go 后端热重载配置。监听 .go 改动，自动重新编译并重启 :8080。
root = "."
testdata_dir = "testdata"
tmp_dir = ".air"

[build]
cmd = "go build -o ./.air/main ."
entrypoint = ["./.air/main"]
include_ext = ["go"]
exclude_dir = ["frontend", "output", "log", ".air", "testdata", "web/static"]
exclude_regex = ["_test.go"]
delay = 300           # ms
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"  # 发中断后等多久再 kill

[log]
time = false
